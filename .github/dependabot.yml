version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR per major version bump, never bundled with patch/minor changes.
    # Most major bumps (vite, vitest, eslint, TS, react) need WXT-compat
    # testing before merging.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
