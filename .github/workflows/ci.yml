name: CI — Lint, Test, Build, Package

# One job on purpose: quality gates and the build run serially anyway
# (build is meaningless on red quality), and a second job would pay for
# a second checkout + npm ci (~half the runner minutes) for nothing.
on:
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'chore/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Prepare WXT
        run: npm run prepare
      - name: Lint
        run: npm run lint -- --max-warnings=50
      - name: Format check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build extension (chrome-mv3)
        run: npm run build
      - name: Zip for store
        run: npm run zip
      - name: Verify artifact
        run: ls -lh .output/*.zip && unzip -l .output/*.zip | head -n 30
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: locator-inspector-${{ github.sha }}
          path: .output/*.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Upload build dir (for debugging)
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-${{ github.sha }}
          path: .output/chrome-mv3
          retention-days: 3
          if-no-files-found: warn
