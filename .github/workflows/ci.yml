name: CI — Build, Lint, Test, Package

on:
  push:
    branches: [main, develop, 'feat/*', 'fix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint • Typecheck • Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare WXT
        run: npm run prepare  # wxt prepare → .wxt/tsconfig.json for typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Test (48 tests)
        run: npm run test

  build:
    name: Build • Zip • Artifact
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build extension (chrome-mv3)
        run: npm run build
      - name: Zip for store
        run: npm run zip
      - name: Verify artifact
        run: ls -lh .output/*.zip && unzip -l .output/*.zip | head -n 30
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: locator-inspector-${{ github.sha }}
          path: .output/*.zip
          retention-days: 14
          if-no-files-found: error
      - name: Upload build dir (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-${{ github.sha }}
          path: .output/chrome-mv3/
          retention-days: 3

  # Optional: auto-publish on version tag (requires CWS secrets)
  # To enable: set secrets CWS_EXTENSION_ID etc. in repo Settings → Secrets
  publish:
    name: Publish to Chrome Web Store
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run zip
      - name: Publish
        uses: mobilefirstllc/cws-publish@latest
        with:
          extension_id: ${{ secrets.CWS_EXTENSION_ID }}
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          zip_file: .output/*.zip
