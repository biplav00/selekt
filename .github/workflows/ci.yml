name: CI — Lint, Test, Build, Package

# One job on purpose: quality gates and the build run serially anyway
# (build is meaningless on red quality), and a second job would pay for
# a second checkout + npm ci (~half the runner minutes) for nothing.
on:
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'chore/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Prepare WXT
        run: npm run prepare
      - name: Lint
        run: npm run lint -- --max-warnings=50
      - name: Format check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Fallow audit (changed files only, non-blocking during rollout)
        # Remove continue-on-error to enforce once backlog is triaged.
        # Uses the pinned devDep via npx so no extra Action install cost.
        # Verdict here never blocks: PR feedback lands as a comment + summary below.
        run: npm run analysis:audit
        continue-on-error: true
      - name: Fallow report (job summary + sticky PR comment)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Audit exits 1 on a fail verdict by design; this step is
          # informational (feedback via summary + PR comment), so never block on it.
          npx fallow audit --gate new-only --format github-summary >> "$GITHUB_STEP_SUMMARY" || true
          npx fallow audit --gate new-only --format github-annotations || true
          npx fallow audit --gate new-only --format pr-comment-github > fallow-comment.md || true
          PR_NUMBER="${{ github.event.pull_request.number }}"
          EXISTING_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate -q '.[] | select(.body | contains("fallow-id: fallow-results")) | .id' | head -n 1)
          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING_ID" -F body=@fallow-comment.md --silent
          else
            gh pr comment "$PR_NUMBER" --body-file fallow-comment.md
          fi
      - name: Test
        run: npm run test
      - name: Build extension (chrome-mv3)
        run: npm run build
      - name: Zip for store
        run: npm run zip
      - name: Verify artifact
        run: ls -lh .output/*.zip && unzip -l .output/*.zip | head -n 30
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: locator-inspector-${{ github.sha }}
          path: .output/*.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Upload build dir (for debugging)
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-${{ github.sha }}
          path: .output/chrome-mv3
          retention-days: 3
          if-no-files-found: warn
