name: CI — Build, Lint, Test, Package

on:
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'chore/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint • Typecheck • Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Prepare WXT
        run: npm run prepare
      - name: Lint
        run: npm run lint -- --max-warnings=50
      - name: Format check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Test (48 tests)
        run: npm run test

  build:
    name: Build • Zip • Artifact
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build extension (chrome-mv3)
        run: npm run build
      - name: Zip for store
        run: npm run zip
      - name: Verify artifact
        run: ls -lh .output/*.zip && unzip -l .output/*.zip | head -n 30
      - name: Upload zip
        uses: actions/upload-artifact@v5
        with:
          name: locator-inspector-${{ github.sha }}
          path: .output/*.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Upload build dir (for debugging)
        uses: actions/upload-artifact@v5
        with:
          name: chrome-mv3-${{ github.sha }}
          path: .output/chrome-mv3
          retention-days: 3
          if-no-files-found: warn
