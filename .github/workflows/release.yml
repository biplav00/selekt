name: Release — Tag, Build, GitHub Release

# Single tag pipeline: build once, attach the zip to the GitHub Release,
# then publish the same zip to the Chrome Web Store (only when store
# credentials are configured — otherwise that step is skipped, not failed).
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint -- --max-warnings=50
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish to Chrome Web Store
        if: ${{ secrets.CWS_EXTENSION_ID != '' }}
        uses: mobilefirstllc/cws-publish@latest
        with:
          extension_id: ${{ secrets.CWS_EXTENSION_ID }}
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          zip_file: .output/*.zip
