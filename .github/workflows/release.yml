name: Release — Tag, Build, GitHub Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint -- --max-warnings=50
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Verify extension zips (build output only, no repo files)
        run: ls -lh .output/*.zip && unzip -l .output/selekt-*-chrome.zip | head -n 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .output/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      # No store publish: Chrome Web Store needs a paid ($5) dev account.
      # Free path is GitHub Release sideload (Chrome) + AMO signed build later (Firefox).
